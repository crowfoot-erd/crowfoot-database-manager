# 중립(기본) 번들 — 실제 문구는 로케일 접미사 번들(messages_ko/en/ja/zh.properties)에 있다.
# 이 파일이 존재해야 Spring Boot의 MessageSourceAutoConfiguration(ResourceBundleCondition)이
# 켜진다: 조건은 basename별 'classpath:<basename>.properties' 존재를 검사하며, 로케일 접미사
# 파일만 있으면 자동구성이 스킵돼 messageSource 빈이 DelegatingMessageSource(모든 조회 null)로
# 떨어지고 모든 서버 문구가 한국어 기본값으로 폴백한다(v1.16 배포 실측, core와 동일 결함).
# 기본 로케일은 ko(WebLocaleConfig)이므로 이 파일은 비어 있어도 된다.
