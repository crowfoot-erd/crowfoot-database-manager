# 빈 검증 표준 문구 (core i18n/validation 미러 — DB 매니저 DTO는 커스텀 message 키 없음)
jakarta.validation.constraints.AssertFalse.message=false여야 합니다
jakarta.validation.constraints.AssertTrue.message=true여야 합니다
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다
jakarta.validation.constraints.Digits.message=자릿수가 한도를 벗어났습니다(정수 {integer}자리, 소수 {fraction}자리까지)
jakarta.validation.constraints.Email.message=올바른 이메일 형식이어야 합니다
jakarta.validation.constraints.Max.message={value} 이하여야 합니다
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다
jakarta.validation.constraints.Negative.message=음수여야 합니다
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다
jakarta.validation.constraints.NotBlank.message=비어 있을 수 없습니다
jakarta.validation.constraints.NotEmpty.message=비어 있을 수 없습니다
jakarta.validation.constraints.NotNull.message=필수값입니다
jakarta.validation.constraints.Null.message=값이 있으면 안 됩니다
jakarta.validation.constraints.Past.message=과거 시각이어야 합니다
jakarta.validation.constraints.PastOrPresent.message=현재 이하 시각이어야 합니다
jakarta.validation.constraints.Future.message=미래 시각이어야 합니다
jakarta.validation.constraints.FutureOrPresent.message=현재 이상 시각이어야 합니다
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다
jakarta.validation.constraints.Positive.message=양수여야 합니다
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다
jakarta.validation.constraints.Size.message=길이가 {min}~{max} 범위를 벗어났습니다
